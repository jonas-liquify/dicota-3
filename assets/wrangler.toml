# Cloudflare Worker Konfiguration für den Upgradebox Product-Finder-Proxy.
# Deploy:  cd tools/upgradebox-proxy && wrangler deploy
# (einmalig vorher:  npm i -g wrangler  &&  wrangler login)

name = "dicota-productfinder"
main = "worker.js"
compatibility_date = "2024-11-01"
account_id = "3d4c4c4eea68ecd4cd31e3509d481839"   # Jonas@halbstark.de's Account

# Öffentliche (nicht-geheime) Variablen — hier anpassen:
[vars]
UPGRADEBOX_SUBID = "0000"                 # Haupt-Account laut Doku Kap. 3
UPGRADEBOX_VERSION = "v1"                 # Pfadsegment: https://api.upgradebox.net/<VERSION>/
ALLOWED_ORIGIN = "https://www.dicota.com,https://dicota.com,https://dicotaestore.myshopify.com"   # Live-Domain(s) + Theme-Preview; kommagetrennt

# userID und PASSWORT gehören NICHT hierher (wären im Repo sichtbar).
# Einmalig als verschlüsselte Secrets setzen:
#   wrangler secret put UPGRADEBOX_USERID
#   wrangler secret put UPGRADEBOX_PASS
